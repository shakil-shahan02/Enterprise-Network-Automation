---
# Enterprise baseline: hostname, security hardening, NTP, Syslog, DNS, management-plane ACL, banner, SNMPv3.
# Every task is tagged so one section can be run on its own, e.g.  --tags ntp,syslog
- name: Hostname from the inventory
  tags: [hostname]
  cisco.ios.ios_config:
    lines:
      - "hostname {{ inventory_hostname }}"
  notify: save config

- name: Global security hardening and services
  tags: [hardening, ssh]
  cisco.ios.ios_config:
    lines:
      - service password-encryption
      - service tcp-keepalives-in
      - service tcp-keepalives-out
      - no service pad
      - no ip http server
      - no ip http secure-server
      - no ip source-route
      - ip ssh version 2
      - ip ssh time-out 60              # (authentication-retries 3 is the IOS default)
      - login block-for 120 attempts 3 within 60
      - login on-failure log
      - login on-success log
    save_when: never
  notify: save config

- name: Local administrator account (password set only when the account is created)
  tags: [users, ssh]
  cisco.ios.ios_user:
    name: netadmin
    privilege: 15
    configured_password: "{{ vault_admin_password }}"
    password_type: secret
    update_password: on_create
    state: present
  notify: save config

- name: NTP client / master
  tags: [ntp]
  cisco.ios.ios_config:
    lines: "{{ ['ntp master 3'] if (ntp_master | default(false)) else ['ntp server ' ~ ntp_server] }}"
  notify: save config

- name: Syslog to the NetOps collector + local buffer
  tags: [syslog, logging]
  cisco.ios.ios_config:
    lines:
      - logging buffered 16384 informational
      - "logging source-interface {{ logging_source }}"
      - "logging {{ syslog_server }}"   # IOS stores 'logging host X' as 'logging X'; trap level informational is the default
  notify: save config

- name: DNS client
  tags: [dns]
  cisco.ios.ios_config:
    lines:
      - "ip name-server {{ dns_server }}"
  when: inventory_hostname != 'R3-DC'
  notify: save config

- name: Configuration-change auditing (archive log -> syslog)
  tags: [archive, logging]
  cisco.ios.ios_config:
    parents: [archive, log config]
    lines:
      - logging enable
      - "{{ archive_notify }}"
      - hidekeys
  notify: save config

- name: Management-plane ACL (who may SSH to network devices)
  tags: [mgmt_acl, ssh, security]
  cisco.ios.ios_config:
    parents: "ip access-list standard {{ mgmt_acl.name }}"
    lines: "{{ mgmt_acl.permit | map('regex_replace', '^', 'permit ') | list + ['deny   any log'] }}"
  notify: save config

- name: Harden VTY lines (SSH only, ACL, timeout)
  tags: [vty, ssh, security]
  cisco.ios.ios_config:
    parents: line vty 0 4
    lines:
      - "access-class {{ mgmt_acl.name }} in"
      - login local                     # (exec-timeout 10 0 is the IOS default)
      - transport preferred none
      - transport input ssh
  notify: save config

- name: Console line
  tags: [console]
  cisco.ios.ios_config:
    parents: line con 0
    lines:
      - logging synchronous
      - transport preferred none
  notify: save config

- name: Legal login banner
  tags: [banner]
  cisco.ios.ios_banner:
    banner: motd
    text: "{{ login_banner }}"
    state: present
  notify: save config

- name: SNMPv3 (authPriv) read-only monitoring
  tags: [snmp]
  cisco.ios.ios_config:
    lines:
      - "snmp-server group {{ snmp.group }} v3 priv{{ snmp_group_suffix }}"
      - "snmp-server location {{ snmp.location_prefix }}-{{ site_name }}"
      - "snmp-server contact {{ snmp.contact }}"
  notify: save config

- name: Check whether the SNMPv3 user already exists
  tags: [snmp]
  cisco.ios.ios_command:
    commands: show snmp user
  register: snmp_users
  changed_when: false

- name: Create SNMPv3 user (only if missing - users are not shown in running-config)
  tags: [snmp]
  cisco.ios.ios_config:
    lines:
      - "snmp-server user {{ snmp.user }} {{ snmp.group }} v3 auth sha {{ vault_snmp_auth }} priv {{ snmp_priv_proto }} {{ vault_snmp_priv }}"
  when: snmp.user not in snmp_users.stdout[0]
  no_log: true
  notify: save config
