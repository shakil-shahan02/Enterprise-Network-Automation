---
# ENT-HYBRID-NET inventory - hierarchical grouping by ROLE and by SITE
all:
  children:
    routers:
      children:
        core_routers:
          hosts:
            R4-CORE: {ansible_host: 10.0.0.4}
        site_routers:
          hosts:
            R1-HQ: {ansible_host: 10.0.0.1}
            R2-BR: {ansible_host: 10.0.0.2}
            R3-DC: {ansible_host: 10.0.0.3}
    switches:
      children:
        distribution_switches:
          hosts:
            SW1-HQ-DIST: {ansible_host: 10.10.99.11}
            SW3-BR-DIST: {ansible_host: 10.20.99.11}
            SW5-DC-DIST: {ansible_host: 10.30.99.11}
        access_switches:
          hosts:
            SW2-HQ-ACC: {ansible_host: 10.10.99.12}
            SW4-BR-ACC: {ansible_host: 10.20.99.12}
            SW6-DC-ACC: {ansible_host: 10.30.99.12}
    # ---- site groups (used for site-specific VLAN / DHCP data) ----
    site_hq:
      hosts:
        R1-HQ:
        SW1-HQ-DIST:
        SW2-HQ-ACC:
    site_branch:
      hosts:
        R2-BR:
        SW3-BR-DIST:
        SW4-BR-ACC:
    site_dc:
      hosts:
        R3-DC:
        SW5-DC-DIST:
        SW6-DC-ACC:
    site_core:
      hosts:
        R4-CORE:
