!
! ===== R3-DC : global / management plane =====
hostname R3-DC
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret __ENABLE_SECRET__
username netadmin privilege 15 secret __ADMIN_SECRET__
ip domain-name corp.local
ip name-server 10.0.0.3
clock timezone AEST 10
! --- SSH (v2 only, RSA 2048) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! --- management ACL: only NETOPS + HQ-IT may SSH to the device ---
ip access-list standard MGMT-ACCESS
 permit 10.30.100.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
 deny any log
exit
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
exit
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
 transport preferred none
exit
! --- NTP / Syslog ---
ntp server 10.0.0.4
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.30.100.10
!
! ===== interfaces =====
interface Loopback0
 description ROUTER-ID / MGMT
 ip address 10.0.0.3 255.255.255.255
exit
interface FastEthernet0/0
 description TRUNK to SW5-DC-DIST f1/0 (router-on-a-stick)
 no ip address
 duplex full
 no shutdown
exit
interface FastEthernet0/0.60
 description VLAN60-SERVERS
 encapsulation dot1Q 60
 ip address 10.30.60.1 255.255.255.0
exit
interface FastEthernet0/0.100
 description VLAN100-NETOPS
 encapsulation dot1Q 100
 ip address 10.30.100.1 255.255.255.0
exit
interface FastEthernet0/0.99
 description VLAN99-MGMT
 encapsulation dot1Q 99
 ip address 10.30.99.1 255.255.255.0
exit
interface FastEthernet1/0
 description P2P to R4-CORE f2/0
 ip address 10.255.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf dead-interval 120
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
interface FastEthernet1/1
 description P2P to R1-HQ f1/1 (backup)
 ip address 10.255.0.14 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf dead-interval 120
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
!
! ===== OSPF multi-area (this router is ABR for area 30) =====
router ospf 1
 router-id 10.0.0.3
 log-adjacency-changes
 auto-cost reference-bandwidth 1000
 area 0 authentication message-digest
 area 30 range 10.30.0.0 255.255.0.0
 passive-interface default
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet1/1
 network 10.0.0.3 0.0.0.0 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.255.0.12 0.0.0.3 area 0
 network 10.30.60.0 0.0.0.255 area 30
 network 10.30.100.0 0.0.0.255 area 30
 network 10.30.99.0 0.0.0.255 area 30
exit
!
! ===== DNS server for corp.local =====
ip dns server
ip domain-lookup
ip host r1-hq.corp.local 10.0.0.1
ip host r2-br.corp.local 10.0.0.2
ip host r3-dc.corp.local 10.0.0.3
ip host r4-core.corp.local 10.0.0.4
ip host sw1-hq-dist.corp.local 10.10.99.11
ip host sw2-hq-acc.corp.local 10.10.99.12
ip host sw3-br-dist.corp.local 10.20.99.11
ip host sw4-br-acc.corp.local 10.20.99.12
ip host sw5-dc-dist.corp.local 10.30.99.11
ip host sw6-dc-acc.corp.local 10.30.99.12
ip host web.corp.local 10.30.60.10
ip host ansible.corp.local 10.30.100.10
ip host syslog.corp.local 10.30.100.10
! upstream resolver for Internet names (reached through R4-CORE PAT)
ip name-server 8.8.8.8
! Server VLAN protection: only web/DNS/ICMP/SSH from inside, everything else logged+dropped
ip access-list extended SERVERS-PROTECT
 remark allow web services, ICMP and management to server VLAN
 permit tcp 10.0.0.0 0.255.255.255 host 10.30.60.10 eq www
 permit tcp 10.0.0.0 0.255.255.255 host 10.30.60.10 eq 443
 permit icmp 10.0.0.0 0.255.255.255 10.30.60.0 0.0.0.255
 permit icmp any 10.30.60.0 0.0.0.255 echo-reply
 permit tcp 10.30.100.0 0.0.0.255 10.30.60.0 0.0.0.255 eq 22
 deny ip 10.10.30.0 0.0.0.255 any log
 permit ip 10.30.0.0 0.0.255.255 any
 deny ip any any log
exit
interface FastEthernet0/0.60
 ip access-group SERVERS-PROTECT out
exit
