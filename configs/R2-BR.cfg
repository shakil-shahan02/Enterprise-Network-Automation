!
! ===== R2-BR : global / management plane =====
hostname R2-BR
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret __ENABLE_SECRET__
username netadmin privilege 15 secret __ADMIN_SECRET__
ip domain-name corp.local
ip name-server 10.0.0.3
clock timezone AEST 10
! --- SSH (v2 only, RSA 2048) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! --- management ACL: only NETOPS + HQ-IT may SSH to the device ---
ip access-list standard MGMT-ACCESS
 permit 10.30.100.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
 deny any log
exit
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
exit
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
 transport preferred none
exit
! --- NTP / Syslog ---
ntp server 10.0.0.4
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.30.100.10
!
! ===== interfaces =====
interface Loopback0
 description ROUTER-ID / MGMT
 ip address 10.0.0.2 255.255.255.255
exit
interface FastEthernet0/0
 description TRUNK to SW3-BR-DIST f1/0 (router-on-a-stick)
 no ip address
 duplex full
 no shutdown
exit
interface FastEthernet0/0.40
 description VLAN40-SALES
 encapsulation dot1Q 40
 ip address 10.20.40.1 255.255.255.0
exit
interface FastEthernet0/0.50
 description VLAN50-OPERATIONS
 encapsulation dot1Q 50
 ip address 10.20.50.1 255.255.255.0
exit
interface FastEthernet0/0.99
 description VLAN99-MGMT
 encapsulation dot1Q 99
 ip address 10.20.99.1 255.255.255.0
exit
interface FastEthernet1/0
 description P2P to R4-CORE f1/1
 ip address 10.255.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
!
! ===== OSPF multi-area (this router is ABR for area 20) =====
router ospf 1
 router-id 10.0.0.2
 log-adjacency-changes
 auto-cost reference-bandwidth 1000
 area 0 authentication message-digest
 area 20 range 10.20.0.0 255.255.0.0
 passive-interface default
 no passive-interface FastEthernet1/0
 network 10.0.0.2 0.0.0.0 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.20.40.0 0.0.0.255 area 20
 network 10.20.50.0 0.0.0.255 area 20
 network 10.20.99.0 0.0.0.255 area 20
exit
!
! ===== DHCP server =====
service dhcp
ip dhcp excluded-address 10.20.40.1 10.20.40.20
ip dhcp excluded-address 10.20.50.1 10.20.50.20
ip dhcp pool BR-SALES
 network 10.20.40.0 255.255.255.0
 default-router 10.20.40.1
 dns-server 10.0.0.3
 domain-name corp.local
 lease 1
exit
ip dhcp pool BR-OPERATIONS
 network 10.20.50.0 255.255.255.0
 default-router 10.20.50.1
 dns-server 10.0.0.3
 domain-name corp.local
 lease 1
exit
