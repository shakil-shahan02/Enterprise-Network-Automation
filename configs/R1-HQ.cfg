!
! ===== R1-HQ : global / management plane =====
hostname R1-HQ
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret __ENABLE_SECRET__
username netadmin privilege 15 secret __ADMIN_SECRET__
ip domain-name corp.local
ip name-server 10.0.0.3
clock timezone AEST 10
! --- SSH (v2 only, RSA 2048) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! --- management ACL: only NETOPS + HQ-IT may SSH to the device ---
ip access-list standard MGMT-ACCESS
 permit 10.30.100.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
 deny any log
exit
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
exit
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
 transport preferred none
exit
! --- NTP / Syslog ---
ntp server 10.0.0.4
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.30.100.10
!
! ===== interfaces =====
interface Loopback0
 description ROUTER-ID / MGMT
 ip address 10.0.0.1 255.255.255.255
exit
interface FastEthernet0/0
 description TRUNK to SW1-HQ-DIST f1/0 (router-on-a-stick)
 no ip address
 duplex full
 no shutdown
exit
interface FastEthernet0/0.10
 description VLAN10-IT
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
exit
interface FastEthernet0/0.20
 description VLAN20-FINANCE
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
exit
interface FastEthernet0/0.30
 description VLAN30-GUEST
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
exit
interface FastEthernet0/0.99
 description VLAN99-MGMT
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
exit
interface FastEthernet1/0
 description P2P to R4-CORE f1/0
 ip address 10.255.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf dead-interval 120
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
interface FastEthernet1/1
 description P2P to R3-DC f1/1 (backup)
 ip address 10.255.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf dead-interval 120
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
!
! ===== OSPF multi-area (this router is ABR for area 10) =====
router ospf 1
 router-id 10.0.0.1
 log-adjacency-changes
 auto-cost reference-bandwidth 1000
 area 0 authentication message-digest
 area 10 range 10.10.0.0 255.255.0.0
 passive-interface default
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet1/1
 network 10.0.0.1 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.12 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 10
 network 10.10.20.0 0.0.0.255 area 10
 network 10.10.30.0 0.0.0.255 area 10
 network 10.10.99.0 0.0.0.255 area 10
exit
!
! ===== DHCP server =====
service dhcp
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.10.30.1 10.10.30.20
ip dhcp pool HQ-IT
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.0.0.3
 domain-name corp.local
 lease 1
exit
ip dhcp pool HQ-FINANCE
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 10.0.0.3
 domain-name corp.local
 lease 1
exit
ip dhcp pool HQ-GUEST
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 10.0.0.3
 domain-name corp.local
 lease 1
exit
!
! ===== ACLs =====
! Guest VLAN: Internet only - no access to any internal 10.0.0.0/8 resource
ip access-list extended GUEST-IN
 remark allow DHCP and DNS, block internal networks, allow Internet
 permit udp any any eq bootps
 permit udp 10.10.30.0 0.0.0.255 host 10.0.0.3 eq domain
 permit icmp 10.10.30.0 0.0.0.255 host 10.10.30.1
 deny ip 10.10.30.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 permit ip 10.10.30.0 0.0.0.255 any
exit
! Finance VLAN: only HQ-IT, NETOPS and the DC servers may reach Finance hosts
ip access-list extended FINANCE-PROTECT
 remark protect finance hosts from branch and guest users
 permit ip 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255
 permit ip 10.30.0.0 0.0.255.255 10.10.20.0 0.0.0.255
 permit ip 10.0.0.0 0.0.0.255 10.10.20.0 0.0.0.255
 deny ip 10.20.0.0 0.0.255.255 10.10.20.0 0.0.0.255 log
 deny ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255 log
 permit ip any any
exit
interface FastEthernet0/0.30
 ip access-group GUEST-IN in
exit
interface FastEthernet0/0.20
 ip access-group FINANCE-PROTECT out
exit
