!EXEC-BEGIN
vlan database
vtp transparent
vlan 40 name SALES
vlan 50 name OPERATIONS
vlan 99 name MGMT
apply
exit
!EXEC-END
!
! ===== SW4-BR-ACC : global / management plane =====
hostname SW4-BR-ACC
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret __ENABLE_SECRET__
username netadmin privilege 15 secret __ADMIN_SECRET__
ip domain-name corp.local
ip name-server 10.0.0.3
clock timezone AEST 10
! --- SSH (v2 only, RSA 2048) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! --- management ACL: only NETOPS + HQ-IT may SSH to the device ---
ip access-list standard MGMT-ACCESS
 permit 10.30.100.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
 deny any log
exit
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
exit
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
 transport preferred none
exit
! --- NTP / Syslog ---
ntp server 10.0.0.4
logging buffered 16384 informational
logging trap informational
logging source-interface Vlan99
logging host 10.30.100.10
!
! ===== L2 switch behaviour (EtherSwitch NM-16ESW) =====
no ip routing
ip default-gateway 10.20.99.1
interface FastEthernet1/1
 description TRUNK to SW3-BR-DIST f1/1
 switchport mode trunk
 no shutdown
exit
interface FastEthernet1/2
 description TRUNK to SW3-BR-DIST f1/2
 switchport mode trunk
 no shutdown
exit
interface FastEthernet1/5
 description ACCESS PC-SALES1 (VLAN 40)
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
exit
interface FastEthernet1/6
 description ACCESS PC-OPS1 (VLAN 50)
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 no shutdown
exit
! --- shut unused ports (security) ---
interface FastEthernet1/3
 description UNUSED
 shutdown
exit
interface FastEthernet1/4
 description UNUSED
 shutdown
exit
interface FastEthernet1/7
 description UNUSED
 shutdown
exit
interface FastEthernet1/8
 description UNUSED
 shutdown
exit
interface FastEthernet1/9
 description UNUSED
 shutdown
exit
interface FastEthernet1/10
 description UNUSED
 shutdown
exit
interface FastEthernet1/11
 description UNUSED
 shutdown
exit
interface FastEthernet1/12
 description UNUSED
 shutdown
exit
interface FastEthernet1/13
 description UNUSED
 shutdown
exit
interface FastEthernet1/14
 description UNUSED
 shutdown
exit
interface FastEthernet1/15
 description UNUSED
 shutdown
exit
interface Vlan1
 no ip address
 shutdown
exit
interface Vlan99
 description MGMT
 ip address 10.20.99.12 255.255.255.0
 no shutdown
exit
