!
! ===== R4-CORE : global / management plane =====
hostname R4-CORE
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret __ENABLE_SECRET__
username netadmin privilege 15 secret __ADMIN_SECRET__
ip domain-name corp.local
ip name-server 10.0.0.3
clock timezone AEST 10
! --- SSH (v2 only, RSA 2048) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! --- management ACL: only NETOPS + HQ-IT may SSH to the device ---
ip access-list standard MGMT-ACCESS
 permit 10.30.100.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
 deny any log
exit
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
exit
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
 transport preferred none
exit
! --- NTP / Syslog ---
ntp master 3
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.30.100.10
!
! ===== interfaces =====
interface Loopback0
 description ROUTER-ID / NTP-MASTER
 ip address 10.0.0.4 255.255.255.255
exit
interface FastEthernet0/0
 description INTERNET (GNS3 NAT cloud) - PAT outside
 ip address dhcp
 ip nat outside
 no shutdown
exit
interface FastEthernet1/0
 description P2P to R1-HQ f1/0
 ip address 10.255.0.1 255.255.255.252
 ip nat inside
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
interface FastEthernet1/1
 description P2P to R2-BR f1/0
 ip address 10.255.0.5 255.255.255.252
 ip nat inside
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
interface FastEthernet2/0
 description P2P to R3-DC f1/0
 ip address 10.255.0.9 255.255.255.252
 ip nat inside
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 __OSPF_KEY__
 duplex full
 speed 100
 no shutdown
exit
!
! ===== NAT / PAT for all enterprise networks =====
no service config
ip access-list extended NAT-INSIDE
 remark do not translate internal-to-internal traffic
 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.0.0.0 0.255.255.255 any
exit
ip nat inside source list NAT-INSIDE interface FastEthernet0/0 overload
!
! ===== OSPF area 0 backbone + default route injection =====
router ospf 1
 router-id 10.0.0.4
 log-adjacency-changes
 auto-cost reference-bandwidth 1000
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet1/1
 no passive-interface FastEthernet2/0
 network 10.0.0.4 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 default-information originate always
exit
